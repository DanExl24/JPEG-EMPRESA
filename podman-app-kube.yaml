apiVersion: v1
kind: Pod
metadata:
  name: jpeg-app
spec:
  containers:
    - name: backend
      image: jpeg-backend:latest
      ports:
        - containerPort: 3000
          hostPort: 3000
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: DATABASE_URL
          value: "postgresql://neondb_owner:npg_jLCF06BkyZHv@ep-misty-river-ahzjwssa.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require"

    - name: frontend
      image: jpeg-frontend:latest
      ports:
        - containerPort: 5173
          hostPort: 5173
      env:
        - name: VITE_API_URL
          value: "http://localhost:3000"
        - name: HOST
          value: "0.0.0.0"
