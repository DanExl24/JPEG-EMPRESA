services:
  # Base de Datos PostgreSQL local (Se usa si DATABASE_URL apunta a esta base de datos o si no se usa Neon/Supabase)
  db:
    image: postgres:16-alpine
    container_name: jpeg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jpeg_db}
    ports:
      - "5436:5432"
    volumes:
      - jpeg_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jpeg_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jpeg

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jpeg_backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jpeg

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: jpeg_frontend
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on:
      - backend
    networks:
      - jpeg

volumes:
  jpeg_db:

networks:
  jpeg:
    driver: bridge
    external: true
