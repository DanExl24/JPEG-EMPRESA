services:
  # Base de Datos PostgreSQL local (postgres:16-alpine)
  db:
    image: postgres:16-alpine
    container_name: jpeg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jpeg_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - jpeg_db:/var/lib/postgresql/data
      - ./poblate/jpegDB.sql:/docker-entrypoint-initdb.d/jpegDB.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jpeg_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jpeg

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jpeg_backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/jpeg_db?schema=public}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:81,http://localhost:5173,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy-network
      - jpeg

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: jpeg_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy-network

volumes:
  jpeg_db:

networks:
  proxy-network:
    external:
      true
  jpeg:
    driver: bridge
