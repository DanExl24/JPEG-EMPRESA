services:
  # Base de Datos PostgreSQL local (postgres:16-alpine)
  db:
    image: postgres:16-alpine
    container_name: jpeg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jpeg_db}
    ports:
      - "${HOST_DB_PORT:-5437}:5432"
    volumes:
      - jpeg_db:/var/lib/postgresql/data
      - ./poblate/jpegDB.sql:/docker-entrypoint-initdb.d/jpegDB.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jpeg_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jpeg

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: jpeg_backend
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-jpeg_db}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-jpeg_db}?schema=public}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://nurse-academy.adsoproject.dev,https://api-nurse-academy.adsoproject.dev,http://localhost:3000,http://localhost:81,http://localhost:5173,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy-network
      - jpeg

  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: jpeg_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy-network

volumes:
  jpeg_db:

networks:
  proxy-network:
    external: true
  jpeg:
    driver: bridge
